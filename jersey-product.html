    <!-- Custom CSS for Dynamic Product Detail Page -->
    <style>
        .product-details-img img {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid #e7e7e7;
            background: #fff;
        }
        .thumbnail-images {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .thumbnail-images img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 5px;
        }
        .thumbnail-images img.active, .thumbnail-images img:hover {
            border-color: #B12704;
        }
        .product-price-wrap .new {
            font-size: 24px;
            font-weight: bold;
            color: #B12704;
        }
        .product-price-wrap .old {
            font-size: 16px;
            text-decoration: line-through;
            color: #767676;
            margin-left: 10px;
        }
        .size-selection {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .size-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: #f9f9f9;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .size-btn.selected {
            border-color: #111;
            background: #111;
            color: #fff;
        }
        .buy-now-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #ffd814;
            border: 1px solid #fcd200;
            border-radius: 4px;
            color: #111;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(213,217,217,.5);
            margin-top: 20px;
        }
        .buy-now-btn:hover {
            background-color: #f7ca00;
            color: #111;
        }
        /* SPIDER-MAN HANGING CORNER STYLES */
        .spider-hanging-corner {
            position: fixed;
            top: 0;
            right: 20px;
            width: 110px;
            height: 180px;
            z-index: 99998;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .spider-string {
            width: 2px;
            height: 50px;
            background: #ffffff;
            opacity: 0.8;
            box-shadow: 0 0 4px rgba(255,255,255,0.6);
        }
        .spider-image {
            width: 90px;
            height: auto;
            object-fit: contain;
            animation: spider-swing 3s ease-in-out infinite alternate;
            transform-origin: top center;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8));
        }
        @keyframes spider-swing {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }
    </style>

    <!-- Dynamic Loader JavaScript -->
    <script>
        // Database of the 4 Jersey products
        const productsData = {
            "1": {
                subtitle: "F1 Edition",
                title: "MERCEDES AMG PETRONAS F1 2025 UNISEX REGULAR FIT POLO (BLACK)",
                newPrice: "₹749",
                oldPrice: "₹1349",
                images: ["assets/images/jersey/j1.jpg", "assets/images/jersey/j2.jpg"],
                checkoutProduct: "F1 MERCEDES PETRONAS BLACK POLO PREMIUM"
            },
            "2": {
                subtitle: "SPECIAL EDITION",
                title: "SCUDERIA FERRARI F1 UNISEX POLO T-SHIRT",
                newPrice: "₹749",
                oldPrice: "₹1349",
                images: ["assets/images/jersey/j3.png", "assets/images/jersey/j4.png"],
                checkoutProduct: "f1 ferrari scuderia red polo premium"
            },
            "3": {
                subtitle: "RACING EDITION",
                title: "CASTORE RED BULL RACING F1 UNISEX POLO T-SHIRT",
                newPrice: "₹1199",
                oldPrice: "₹1349",
                images: ["assets/images/jersey/j5.webp", "assets/images/jersey/j6.jpg"],
                checkoutProduct: "F1 RED BULL RACING TEAM BLUE JERSEY"
            },
            "4": {
                subtitle: "F1 Edition",
                title: "MERCEDES AMG PETRONAS F1 2025",
                newPrice: "₹1199",
                oldPrice: "₹1499",
                images: ["assets/images/jersey/j7.webp", "assets/images/jersey/j8.webp"],
                checkoutProduct: "MERCEDES AMG PETRONAS F1 2025"
            }
        };

        // Get product ID from URL query parameters (e.g., jersey-product.html?id=1)
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id') || "1"; // Default to product 1 if none specified

        const product = productsData[productId] || productsData["1"];

        // Populate elements dynamically
        document.getElementById('product-subtitle').innerText = product.subtitle;
        document.getElementById('product-title').innerText = product.title;
        document.getElementById('breadcrumb-title').innerText = product.title;
        document.getElementById('product-new-price').innerText = product.newPrice;
        document.getElementById('product-old-price').innerText = product.oldPrice;
        document.getElementById('buy-now-link').href = `checkout.html?product=${encodeURIComponent(product.checkoutProduct)}`;

        // Set Main Image
        const mainImg = document.getElementById('main-product-img');
        mainImg.src = product.images[0];

        // Populate Thumbnails
        const thumbContainer = document.getElementById('thumbnail-container');
        product.images.forEach((imgSrc, index) => {
            const thumb = document.createElement('img');
            thumb.src = imgSrc;
            if (index === 0) thumb.classList.add('active');
            thumb.onclick = function() {
                mainImg.src = imgSrc;
                document.querySelectorAll('.thumbnail-images img').forEach(i => i.classList.remove('active'));
                thumb.classList.add('active');
            };
            thumbContainer.appendChild(thumb);
        });

        // Size selector function
        function selectSize(element, size) {
            document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
        }
    </script>
